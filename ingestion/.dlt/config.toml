# Non-secret dlt configuration. Secrets live in secrets.toml (gitignored) or env vars.
# Docs: https://dlthub.com/docs/general-usage/credentials

[runtime]
# Bump to "DEBUG" when troubleshooting a load.
log_level = "INFO"

[destination.databricks]
# Default table format. The advanced/iceberg_table_format.py example overrides this to "iceberg".
# table_format = "delta"
# Credential fields cannot live in config.toml under dlt 1.30's secret-value validation. The
# shared _common.py bootstrap defaults catalog=workspace and session_timezone=UTC; override either
# through .env or put credentials in secrets.toml.

# Optional: staging via a Unity Catalog Volume for bulk/file loads (see docs/setup-databricks.md).
# [destination.databricks]
# staging_volume_name = "main.raw.dlt_staging"

# Optional: required by advanced/zerobus_append.py. Environment variables are preferable when
# sharing this file; see .env.example and ingestion/README.md.
# [destination.databricks.zerobus]
# endpoint_url = "https://<workspace-id>.zerobus.<region>.cloud.databricks.com"
